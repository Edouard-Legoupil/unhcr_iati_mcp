[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name="unhcr-iati-mcp"
version="0.0.1"
description = "UNHCR IATI MCP Server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Edouard Legoupil", email = "legoupil@unhcr.org"}
]
keywords = [
    "mcp",
    "unhcr",
    "refugee",
    "iati",
    "data",
    "api",
    "fastmcp",
    "llm",
    "ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
]
dependencies=[
  "fastmcp>=1.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0,<3.0.0",
  "pydantic-settings>=2.2.0,<3.0.0",
  "prometheus-client>=0.20.0",
  "tenacity>=8.2.0",
  "redis>=5.0.0",
  "python-dotenv>=1.0.0",
  "starlette>=0.38.0,<1.0.0",
  "uvicorn[standard]>=0.30.0",
  "cryptography>=42.0.0",
  "python-multipart>=0.0.6",
  "pyreadr>=0.4.0",
  "pyjwt>=2.8.0",
  "python-jose[cryptography]>=3.3.0",
  "azure-functions>=1.21.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "json-logging>=1.0.0",
    "httpx>=0.24.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
unhcr-mcp = "unhcr_iait_mcp.main:main"

[project.urls]
Homepage = "https://github.com/edouard-legoupil/unhcr_iati_mcp"
Documentation = "https://github.com/edouard-legoupil/unhcr_iati_mcp#readme"
Repository = "https://github.com/edouard-legoupil/unhcr_iati_mcp"
Issues = "https://github.com/edouard-legoupil/unhcr_iati_mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["unhcr_iati_mcp*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.isort]
known-first-party = ["unhcr_mcp"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "fastmcp.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
